port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # true (unlike livekit.yaml's local/dev false): the VPS has a real public
  # IP, so the server uses STUN to discover and advertise it as the ICE
  # candidate for media, instead of a hardcoded NODE_IP. The signalling port
  # (7880) itself stays internal-only here -- Traefik terminates TLS and
  # reverse-proxies wss:// to it over the n8n_default docker network.
  use_external_ip: true

# API keys are intentionally NOT set here (see AGENTS.md rule 6: no secrets in git).
# They are injected at container start via the LIVEKIT_KEYS env var, sourced from .env.
# LIVEKIT_KEYS format: "<key>: <secret>" (same shape as the yaml "keys" map, as a string).
