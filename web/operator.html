<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operator Console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    input, button { font-size: 1rem; padding: 0.4rem 0.8rem; }
    input[type="number"] { width: 6rem; }
    input[type="text"] { flex: 1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { color: #666; margin-bottom: 1rem; }
    #transcript {
      border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem;
      height: 320px; overflow-y: auto; background: #fafafa; margin-bottom: 1rem;
    }
    .line { margin-bottom: 0.5rem; line-height: 1.4; }
    .line .speaker { font-weight: 600; }
    .line.agent .speaker { color: #1a56db; }
    .line.user .speaker { color: #0f7a3d; }
    .line.operator .speaker { color: #b45309; }
    .line.interim { opacity: 0.6; }
    #whisper-log { font-size: 0.85rem; color: #555; }
    #whisper-log .entry { margin-bottom: 0.25rem; }
    #whisper-log .entry time { color: #999; margin-right: 0.5rem; }
    #takeover-btn.active { background: #b45309; color: #fff; }
  </style>
</head>
<body>
  <h1>Operator Console</h1>
  <p>Hidden listener by default: you hear both sides, but neither party sees or hears you.
  "Take over" publishes your mic so the customer hears you directly -- see README for the
  visibility trade-off that comes with that.</p>

  <div class="row">
    <input id="call-id-input" type="number" placeholder="Call ID" />
    <button id="join-btn">Join</button>
    <button id="leave-btn" disabled>Leave</button>
  </div>

  <div class="row">
    <button id="takeover-btn" disabled>Take over</button>
    <button id="handback-btn" disabled>Hand back</button>
  </div>

  <div id="status">Not connected.</div>

  <div id="transcript"></div>

  <div class="row">
    <input id="whisper-input" type="text" placeholder="Whisper guidance to the agent..." disabled />
    <button id="whisper-btn" disabled>Send</button>
  </div>

  <div id="whisper-log"></div>

  <div id="remote-audio-container" style="display: none"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/livekit-client/2.23.0/livekit-client.umd.min.js"></script>
  <script src="operator.js"></script>
</body>
</html>
